openapi: 3.0.3
info:
  title: AgentWeb API
  description: >
    AgentWeb is an Internet Intelligence Platform. This spec covers the core
    outcome-first endpoints (/solve, /observe) and low-level primitives
    (/search, /crawl, /browser, /extract, /memory, /graph). See docs/api for
    prose documentation.
  version: "1.0.0"
servers:
  - url: https://api.agentweb.dev/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Check local API liveness
      operationId: health
      responses:
        '200':
          description: Service and local dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded because a local dependency check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /report/{execution_id}/replay:
    get:
      summary: Project a historical execution trace for read-only replay inspection
      operationId: replayReport
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Historical replay projection; no network or side effects are executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '404':
          $ref: '#/components/responses/BadRequest'
  /report/{execution_id}:
    get:
      summary: Retrieve a secret-safe execution trace
      operationId: getReport
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution trace
        '404':
          $ref: '#/components/responses/BadRequest'
  /memory/{target}:
    get:
      summary: List immutable snapshots for a target
      operationId: getMemory
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: target
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Snapshot history
  /memory/{target}/diff:
    get:
      summary: Compare two snapshots for a target
      operationId: getMemoryDiff
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Snapshot diff
        '404':
          $ref: '#/components/responses/BadRequest'
  /plan:
    post:
      summary: Create an inspectable plan without executing it
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: Tenant-scoped expiring plan; task text is not returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
  /execute:
    post:
      summary: Execute a previously approved plan
      operationId: executePlan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
      responses:
        '200':
          description: Grounded solve response produced from the approved plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolveResponse'
  /solve:
    post:
      summary: Run a one-shot grounded research/synthesis task
      operationId: solve
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolveRequest'
      responses:
        '200':
          description: Grounded, cited result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /observe:
    get:
      summary: List monitors for the authenticated organization
      operationId: listMonitors
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated organization monitors
    post:
      summary: Create a recurring monitor
      operationId: observe
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObserveRequest'
      responses:
        '200':
          description: Monitor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
  /observe/{id}:
    get:
      summary: Get monitor status/history
      operationId: getMonitor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Monitor status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
    delete:
      summary: Cancel a monitor
      operationId: cancelMonitor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Monitor cancelled
  /search:
    post:
      summary: Low-level search primitive
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  default: 10
                  maximum: 50
                freshness:
                  type: string
                  enum: [day, week, month, year, any]
      responses:
        '200':
          description: Provider-backed search results with local fallback
  /crawl:
    post:
      summary: Traverse same-origin pages with bounded breadth-first crawling
      operationId: crawl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_url]
              properties:
                start_url:
                  type: string
                  format: uri
                max_pages:
                  type: integer
                  default: 50
                  maximum: 50
                depth:
                  type: integer
                  default: 2
                  maximum: 10
                url_pattern:
                  type: string
                idempotency_key:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Crawled pages, bounded metadata, durable crawl identifier, and truncation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlResult'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      summary: List crawl runs for the authenticated organization
      operationId: listCrawls
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tenant-scoped crawl history
          content:
            application/json:
              schema:
                type: object
                required: [data, crawls, next_cursor, has_more]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CrawlRun'
                  crawls:
                    type: array
                    items:
                      $ref: '#/components/schemas/CrawlRun'
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'
  /crawl/{crawlId}:
    get:
      summary: Retrieve one tenant-scoped crawl run and its bounded page metadata
      operationId: getCrawl
      parameters:
        - name: crawlId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Crawl run and page metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CrawlRun'
                  - type: object
                    required: [pages, data]
                    properties:
                      pages:
                        type: array
                        items:
                          $ref: '#/components/schemas/CrawlPage'
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CrawlPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /browser/sessions:
    post:
      summary: Render a page and execute bounded browser actions
      operationId: browserOpen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserRequest'
      responses:
        '200':
          description: Rendered browser session, including partial results on action failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Browser runtime unavailable
  /graph/query:
    get:
      summary: Query the tenant knowledge graph
      operationId: queryGraph
      parameters:
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: related_to
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: relation
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: depth
          in: query
          required: false
          description: Maximum traversal depth, bounded to three hops.
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching graph nodes and corroboration-aware edges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphResponse'
  /graph/entities:
    post:
      summary: Upsert an organization-scoped graph entity
      operationId: upsertGraphEntity
      security:
        - bearerAuth: [graph:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphEntityInput'
      responses:
        '201':
          description: Created or merged graph entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphEntity'
  /graph/relations:
    post:
      summary: Upsert an organization-scoped graph relation
      operationId: upsertGraphRelation
      security:
        - bearerAuth: [graph:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphRelationInput'
      responses:
        '201':
          description: Created or corroborated graph relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphRelation'
  /workflows:
    get:
      summary: List event-driven workflow definitions
      operationId: listWorkflows
      security:
        - bearerAuth: [workflow:manage]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Organization-scoped workflow definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
    post:
      summary: Register a monitor event workflow
      operationId: createWorkflow
      security:
        - bearerAuth: [workflow:manage]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInput'
      responses:
        '201':
          description: Workflow definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
  /workflows/runs:
    get:
      summary: List workflow execution runs
      operationId: listWorkflowRuns
      security:
        - bearerAuth: [workflow:manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Organization-scoped workflow runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunPage'
  /admin/keys:
    get:
      summary: List redacted API keys for the authenticated organization
      operationId: listApiKeys
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Redacted organization API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a scoped API key for the authenticated organization
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: API key secret, returned only at creation time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/keys/{id}:
    delete:
      summary: Revoke an API key owned by the authenticated organization
      operationId: revokeApiKey
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API key revoked
        '404':
          $ref: '#/components/responses/BadRequest'
  /admin/browser-credentials:
    get:
      summary: List non-secret browser credential metadata for the organization
      operationId: listBrowserCredentials
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Browser credential metadata without secret values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCredentialPage'
    post:
      summary: Create an encrypted browser credential for the organization
      operationId: createBrowserCredential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserCredentialCreate'
      responses:
        '201':
          description: Created credential metadata; the secret is never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserCredential'
  /admin/browser-credentials/{id}:
    delete:
      summary: Revoke an encrypted browser credential owned by the organization
      operationId: revokeBrowserCredential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Browser credential revoked
        '404':
          $ref: '#/components/responses/BadRequest'
  /admin/browser-session-states:
    get:
      summary: List non-secret browser session-state metadata for the organization
      operationId: listBrowserSessionStates
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Browser session-state metadata without cookies or storage tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSessionStatePage'
    post:
      summary: Create encrypted browser storage state for an authorized origin
      operationId: createBrowserSessionState
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserSessionStateCreate'
      responses:
        '201':
          description: Created session-state metadata; cookies and storage values are never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSessionState'
  /admin/browser-session-states/{id}:
    delete:
      summary: Revoke encrypted browser session state owned by the organization
      operationId: revokeBrowserSessionState
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Browser session state revoked
        '404':
          $ref: '#/components/responses/BadRequest'
  /admin/audit:
    get:
      summary: Read immutable security audit events for the organization
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: action
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: actor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: target
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: since
          in: query
          required: false
          description: Inclusive Unix timestamp or ISO-8601 UTC timestamp.
          schema:
            type: string
        - name: until
          in: query
          required: false
          description: Inclusive Unix timestamp or ISO-8601 UTC timestamp.
          schema:
            type: string
      responses:
        '200':
          description: Organization audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
  /admin/usage:
    get:
      summary: Read current-period usage and estimated cost for the organization
      operationId: getUsage
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}$'
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
  /admin/metrics:
    get:
      summary: Read organization-scoped operational metrics
      operationId: getMetrics
      responses:
        '200':
          description: Organization-filtered counters, observations, and gauges
          content:
            application/json:
              schema:
                type: object
                required: [counters, observations, gauges, captured_at]
                properties:
                  counters:
                    type: object
                  observations:
                    type: object
                  gauges:
                    type: object
                  captured_at:
                    type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/data:
    delete:
      summary: Delete organization-owned snapshots, crawl history, and execution traces
      operationId: deleteOrganizationData
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [snapshots, traces, crawls, session_states, all]
                  default: snapshots
                target:
                  type: string
                execution_id:
                  type: string
      responses:
        '200':
          description: Deletion counts for the authenticated organization
          content:
            application/json:
              schema:
                type: object
                required: [org_id, kind, deleted_snapshots, deleted_traces, deleted_crawls, deleted_session_states]
                properties:
                  org_id:
                    type: string
                  kind:
                    type: string
                  deleted_snapshots:
                    type: integer
                  deleted_traces:
                    type: integer
                  deleted_crawls:
                    type: integer
                  deleted_session_states:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /extract:
    post:
      summary: Structured extraction from a page
      operationId: extract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                schema:
                  type: object
      responses:
        '200':
          description: Extracted structured data with confidence metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing/invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: API key does not have the required scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    WorkflowInput:
      type: object
      required: [name, monitor_id, task_template]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        monitor_id:
          type: string
        task_template:
          type: string
          minLength: 1
          maxLength: 2000
          description: Bounded format template. Supported values include {event}, {monitor_id}, {target}, {from_hash}, {to_hash}, and {timestamp}.
        event:
          type: string
          enum: [monitor.change_detected, monitor.no_change]
          default: monitor.change_detected
        mode:
          type: string
          enum: [flash, focus, dive]
          default: focus
    Workflow:
      type: object
      required: [id, name, monitor_id, event, task_template, mode, status]
      properties:
        id: { type: string }
        org_id: { type: string }
        name: { type: string }
        monitor_id: { type: string }
        event: { type: string }
        task_template: { type: string }
        mode: { type: string }
        status: { type: string }
        created_at: { type: number }
        updated_at: { type: number }
    WorkflowRun:
      type: object
      required: [id, workflow_id, monitor_id, event, status, created_at]
      properties:
        id: { type: string }
        workflow_id: { type: string }
        org_id: { type: string }
        monitor_id: { type: string }
        event: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        execution_id: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        created_at: { type: number }
        completed_at: { type: [number, 'null'] }
    WorkflowPage:
      type: object
      required: [workflows, data, has_more]
      properties:
        _meta: { $ref: '#/components/schemas/ResponseMetadata' }
        workflows: { type: array, items: { $ref: '#/components/schemas/Workflow' } }
        data: { type: array, items: { $ref: '#/components/schemas/Workflow' } }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    WorkflowRunPage:
      type: object
      required: [runs, data]
      properties:
        _meta: { $ref: '#/components/schemas/ResponseMetadata' }
        runs: { type: array, items: { $ref: '#/components/schemas/WorkflowRun' } }
        data: { type: array, items: { $ref: '#/components/schemas/WorkflowRun' } }
    GraphEntityInput:
      type: object
      required: [type, name]
      properties:
        id:
          type: string
          pattern: '^ent_[A-Za-z0-9_-]+$'
        type:
          type: string
          minLength: 1
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 500
        attributes:
          type: object
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_ids:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
    GraphRelationInput:
      type: object
      required: [from_id, to_id, relation]
      properties:
        from_id:
          type: string
        to_id:
          type: string
        relation:
          type: string
          minLength: 1
          maxLength: 120
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_ids:
