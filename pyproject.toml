[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentweb"
version = "0.8.0"
description = "A free, dependency-light implementation of AgentWeb's grounded research MVP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "BHARANI KUMAR S", email = "itsmebk2007@gmail.com" }]
keywords = ["web-research", "web-monitoring", "citations", "internet-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
]

dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
browser = ["playwright>=1.40", "cryptography>=42"]
postgres = ["psycopg[binary]>=3.1"]
production = ["psycopg[binary]>=3.1"]

[project.scripts]
agentweb = "agentweb.cli:main"
agentweb-mcp = "agentweb.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
